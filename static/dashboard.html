<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASM Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        dark: { bg: '#051424', surface: '#122131', border: '#273647', text: '#d4e4fa' },
                        light: { bg: '#f3f4f6', surface: '#ffffff', border: '#e5e7eb', text: '#111827' },
                        brand: { DEFAULT: '#4f8cff', hover: '#6ba1ff' }
                    }
                }
            }
        }
    </script>
    <style>
        body { transition: background-color 0.3s, color 0.3s; }
        .toast-enter { animation: slideIn 0.3s ease-out forwards; }
        .toast-leave { animation: slideOut 0.3s ease-in forwards; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes slideOut { from { transform: translateX(0); opacity: 1; } to { transform: translateX(100%); opacity: 0; } }
    </style>
</head>
<body class="bg-light-bg dark:bg-dark-bg text-light-text dark:text-dark-text font-sans antialiased overflow-x-hidden min-h-screen">

    <!-- Toast Container -->
    <div id="toast-container" class="fixed top-20 right-6 z-50 flex flex-col gap-2"></div>

    <!-- Sidebar (Desktop) -->
    <aside class="h-screen w-64 fixed left-0 top-0 bg-light-surface dark:bg-dark-surface border-r border-light-border dark:border-dark-border hidden md:flex flex-col p-6 z-40">
        <div class="text-2xl font-bold text-brand mb-8 flex items-center gap-2">
            <span class="material-symbols-outlined">radar</span> ASM Dashboard
        </div>
        <nav class="flex flex-col gap-2">
            <div class="bg-brand/10 text-brand font-semibold flex items-center gap-3 p-3 rounded-lg cursor-pointer">
                <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">dashboard</span>
                <span>Vue d'ensemble</span>
            </div>
            <div class="hover:bg-gray-100 dark:hover:bg-gray-800 flex items-center gap-3 p-3 rounded-lg cursor-pointer transition-colors text-gray-600 dark:text-gray-300">
                <span class="material-symbols-outlined">inventory_2</span>
                <span>Inventaire</span>
            </div>
            <div class="hover:bg-gray-100 dark:hover:bg-gray-800 flex items-center gap-3 p-3 rounded-lg cursor-pointer transition-colors text-gray-600 dark:text-gray-300">
                <span class="material-symbols-outlined">bug_report</span>
                <span>Vulnérabilités</span>
            </div>
        </nav>
    </aside>

    <!-- Top Navigation -->
    <header class="fixed top-0 right-0 w-full md:w-[calc(100%-16rem)] z-30 bg-light-surface dark:bg-dark-surface border-b border-light-border dark:border-dark-border flex items-center justify-between px-6 h-16">
        <!-- Search Bar -->
        <div class="flex items-center gap-3 w-full max-w-md bg-gray-100 dark:bg-[#0d1c2d] px-4 py-2 rounded-lg border border-transparent focus-within:border-brand transition-colors">
            <span class="material-symbols-outlined text-gray-500">search</span>
            <input type="text" id="searchInput" placeholder="Rechercher un domaine, un statut..." class="bg-transparent border-none focus:ring-0 text-sm w-full outline-none text-light-text dark:text-dark-text placeholder-gray-500">
        </div>
        
        <!-- Actions -->
        <div class="flex items-center gap-4">
            <button id="themeToggle" class="p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-800 transition-colors text-gray-600 dark:text-gray-300">
                <span class="material-symbols-outlined" id="themeIcon">light_mode</span>
            </button>
            <button class="p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-800 transition-colors text-gray-600 dark:text-gray-300 relative">
                <span class="material-symbols-outlined">notifications</span>
                <span class="absolute top-2 right-2 w-2 h-2 bg-red-500 rounded-full"></span>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="md:ml-64 pt-24 pb-12 px-6 max-w-7xl mx-auto">
        
        <!-- Scan Launcher -->
        <section class="mb-8">
            <div class="bg-light-surface dark:bg-dark-surface p-6 rounded-xl border border-light-border dark:border-dark-border shadow-sm">
                <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6">
                    <div>
                        <h2 class="text-xl font-bold mb-1">Lancer un nouveau Scan</h2>
                        <p class="text-sm text-gray-500 dark:text-gray-400">Découverte automatisée de surface d'attaque.</p>
                    </div>
                </div>
                
                <div class="flex gap-4">
                    <div class="relative w-full">
                        <span class="absolute left-4 top-1/2 -translate-y-1/2 material-symbols-outlined text-gray-400">language</span>
                        <input type="text" id="domainInput" placeholder="ex: target.com" class="w-full pl-12 pr-4 py-3 bg-gray-50 dark:bg-[#051424] border border-light-border dark:border-dark-border rounded-lg focus:border-brand focus:ring-1 focus:ring-brand outline-none transition-all text-sm font-mono">
                    </div>
                    <button id="launchBtn" class="bg-brand hover:bg-brand-hover text-white font-semibold px-6 py-3 rounded-lg flex items-center gap-2 transition-transform active:scale-95 whitespace-nowrap">
                        <span class="material-symbols-outlined">rocket_launch</span>
                        Lancer
                    </button>
                </div>
            </div>
        </section>

        <!-- Scans History -->
        <section class="mb-8">
            <div class="bg-light-surface dark:bg-dark-surface rounded-xl border border-light-border dark:border-dark-border shadow-sm overflow-hidden">
                <div class="p-6 border-b border-light-border dark:border-dark-border flex items-center justify-between">
                    <h2 class="text-xl font-bold">Historique des Scans</h2>
                    <span class="text-xs text-gray-500 flex items-center gap-1"><span class="material-symbols-outlined text-[14px] animate-spin">sync</span> Actualisation auto</span>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse text-sm">
                        <thead class="bg-gray-50 dark:bg-dark-bg text-gray-500 dark:text-gray-400">
                            <tr>
                                <th class="px-6 py-4 font-semibold uppercase tracking-wider text-xs">ID</th>
                                <th class="px-6 py-4 font-semibold uppercase tracking-wider text-xs">Domaine</th>
                                <th class="px-6 py-4 font-semibold uppercase tracking-wider text-xs">Date</th>
                                <th class="px-6 py-4 font-semibold uppercase tracking-wider text-xs">Statut</th>
                                <th class="px-6 py-4 font-semibold uppercase tracking-wider text-xs">Progression</th>
                                <th class="px-6 py-4 font-semibold uppercase tracking-wider text-xs text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="scansTableBody" class="divide-y divide-light-border dark:divide-dark-border">
                            <tr><td colspan="6" class="px-6 py-8 text-center text-gray-500">Chargement...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

        <!-- Detailed Results Panel (Hidden by default) -->
        <section id="results-panel" class="hidden bg-light-surface dark:bg-dark-surface rounded-xl border border-light-border dark:border-dark-border shadow-sm overflow-hidden mb-8 scroll-mt-24">
            <div class="p-6 border-b border-light-border dark:border-dark-border flex justify-between items-center">
                <h2 id="resultsTitle" class="text-xl font-bold">Résultats</h2>
                <button onclick="closeResults()" class="text-gray-500 hover:text-gray-800 dark:hover:text-white"><span class="material-symbols-outlined">close</span></button>
            </div>
            <div id="resultsContent" class="p-6 text-sm"></div>
        </section>

    </main>

    <script>
        const API_BASE = ""; 
        let allScansData = []; 
        let autoRefreshInterval = null;

        // --- Notifications (Toasts) ---
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const icon = type === 'success' ? 'check_circle' : 'error';
            const colors = type === 'success' ? 'bg-green-100 text-green-800 border-green-200 dark:bg-green-900/30 dark:text-green-400 dark:border-green-800' : 'bg-red-100 text-red-800 border-red-200 dark:bg-red-900/30 dark:text-red-400 dark:border-red-800';
            
            toast.className = `flex items-center gap-3 px-4 py-3 rounded-lg border shadow-lg text-sm font-medium toast-enter ${colors}`;
            toast.innerHTML = `<span class="material-symbols-outlined">${icon}</span> ${message}`;
            
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.classList.replace('toast-enter', 'toast-leave');
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        // --- Gestion du Thème ---
        const themeToggle = document.getElementById("themeToggle");
        const html = document.documentElement;
        const themeIcon = document.getElementById("themeIcon");
        
        function updateTheme(theme) {
            if (theme === 'dark') {
                html.classList.add('dark');
                themeIcon.textContent = 'light_mode';
            } else {
                html.classList.remove('dark');
                themeIcon.textContent = 'dark_mode';
            }
            localStorage.setItem("asm-theme", theme);
        }

        const savedTheme = localStorage.getItem("asm-theme") || "dark";
        updateTheme(savedTheme);

        themeToggle.addEventListener("click", () => {
            const isDark = html.classList.contains('dark');
            updateTheme(isDark ? 'light' : 'dark');
        });

        // --- Utilitaires Input & Regex ---
        function cleanDomain(input) {
            let domain = input.trim();
            // Extrait le hostname si l'utilisateur entre une URL complète
            if (domain.startsWith("http://") || domain.startsWith("https://")) {
                try { domain = new URL(domain).hostname; } catch(e) {}
            }
            // Enlève les chemins restants
            return domain.split('/')[0];
        }

        function isValidDomain(domain) {
            const regex = /^([a-zA-Z0-9]([a-zA-Z0-9\-]{0,61}[a-zA-Z0-9])?\.)+[a-zA-Z]{2,}$/;
            return regex.test(domain);
        }

        // --- Lancement d'un Scan ---
        const launchBtn = document.getElementById("launchBtn");
        const domainInput = document.getElementById("domainInput");

        // Raccourci Entrée
        domainInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
                e.preventDefault();
                launchBtn.click();
            }
        });

        launchBtn.addEventListener("click", async () => {
            const rawInput = domainInput.value.trim();
            if (!rawInput) return;

            const domain = cleanDomain(rawInput);

            if (!isValidDomain(domain)) {
                showToast("Format de domaine invalide (ex: nmap.org)", "error");
                return;
            }

            domainInput.value = ""; // Clear input immediately
            launchBtn.disabled = true;
            launchBtn.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span>...';

            try {
                const res = await fetch(`${API_BASE}/api/scan`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ domain })
                });
                const data = await res.json();
                
                if(res.ok) {
                    showToast(`Scan lancé avec succès pour ${domain}`, "success");
                    loadScans(); // Reload immediately
                } else {
                    showToast(data.detail || "Erreur lors du lancement.", "error");
                }
            } catch (err) {
                showToast("Erreur de connexion au serveur.", "error");
            } finally {
                launchBtn.disabled = false;
                launchBtn.innerHTML = '<span class="material-symbols-outlined">rocket_launch</span> Lancer';
            }
        });

        // --- Recherche et Filtrage ---
        const searchInput = document.getElementById("searchInput");
        searchInput.addEventListener("input", (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = allScansData.filter(s => 
                s.domaine_cible.toLowerCase().includes(term) || 
                s.id.toString().includes(term) ||
                s.statut.toLowerCase().includes(term)
            );
            renderTable(filtered);
        });

        // --- Chargement des Scans ---
        async function loadScans() {
            try {
                const res = await fetch(`${API_BASE}/api/scans`);
                allScansData = await res.json();
                
                // Appliquer le filtre de recherche actif si existant
                const term = searchInput.value.toLowerCase();
                if(term) {
                    const filtered = allScansData.filter(s => s.domaine_cible.toLowerCase().includes(term) || s.statut.toLowerCase().includes(term));
                    renderTable(filtered);
                } else {
                    renderTable(allScansData);
                }

                const hasRunningScan = allScansData.some(scan => scan.statut === "En cours");
                if (hasRunningScan && !autoRefreshInterval) {
                    autoRefreshInterval = setInterval(loadScans, 3000);
                } else if (!hasRunningScan && autoRefreshInterval) {
                    clearInterval(autoRefreshInterval);
                    autoRefreshInterval = null;
                }
            } catch (err) {
                document.getElementById("scansTableBody").innerHTML = '<tr><td colspan="6" class="px-6 py-4 text-center text-red-500">Erreur de chargement.</td></tr>';
            }
        }

        function renderTable(scans) {
            const tbody = document.getElementById("scansTableBody");
            
            if (scans.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="px-6 py-8 text-center text-gray-500 italic">Aucun scan trouvé.</td></tr>';
                return;
            }

            const statusStyles = {
                "Terminé": "bg-green-100 text-green-700 dark:bg-green-500/10 dark:text-green-400 border-green-200 dark:border-green-500/20",
                "En cours": "bg-yellow-100 text-yellow-700 dark:bg-yellow-500/10 dark:text-yellow-400 border-yellow-200 dark:border-yellow-500/20",
                "Erreur": "bg-red-100 text-red-700 dark:bg-red-500/10 dark:text-red-400 border-red-200 dark:border-red-500/20"
            };

            let html = "";
            for (const scan of scans) {
                const style = statusStyles[scan.statut] || statusStyles["Erreur"];
                
                let progressCell = "-";
                if (scan.statut === "En cours") {
                    const pct = scan.total_sous_domaines > 0 ? Math.round((scan.sous_domaines_faits / scan.total_sous_domaines) * 100) : 0;
                    progressCell = `
                        <div class="w-full max-w-[150px]">
                            <div class="bg-gray-200 dark:bg-gray-700 rounded-full h-1.5 mb-1 overflow-hidden">
                                <div class="bg-brand h-1.5 rounded-full transition-all duration-500" style="width: ${pct}%"></div>
                            </div>
                            <div class="text-[10px] text-gray-500">${scan.sous_domaines_faits}/${scan.total_sous_domaines} — ${scan.etape_actuelle || "..."}</div>
                        </div>`;
                }

                html += `
                    <tr class="hover:bg-gray-50 dark:hover:bg-gray-800/50 transition-colors">
                        <td class="px-6 py-4 font-mono">#${scan.id}</td>
                        <td class="px-6 py-4 font-medium">${scan.domaine_cible}</td>
                        <td class="px-6 py-4 text-gray-500 dark:text-gray-400">${scan.date_debut}</td>
                        <td class="px-6 py-4">
                            <span class="px-2.5 py-1 rounded-full text-xs font-semibold border ${style}">${scan.statut}</span>
                        </td>
                        <td class="px-6 py-4">${progressCell}</td>
                        <td class="px-6 py-4 text-right">
                            <div class="flex items-center justify-end gap-2">
                                <button onclick="viewResults(${scan.id})" class="p-1.5 text-gray-500 hover:text-brand bg-gray-100 dark:bg-gray-800 rounded transition-colors" title="Voir">
                                    <span class="material-symbols-outlined text-[18px]">visibility</span>
                                </button>
                                <a href="/api/scan/${scan.id}/report.html" target="_blank" class="p-1.5 text-gray-500 hover:text-blue-500 bg-gray-100 dark:bg-gray-800 rounded transition-colors" title="Rapport HTML">
                                    <span class="material-symbols-outlined text-[18px]">html</span>
                                </a>
                                <a href="/api/scan/${scan.id}/report.pdf" target="_blank" class="p-1.5 text-gray-500 hover:text-red-500 bg-gray-100 dark:bg-gray-800 rounded transition-colors" title="Rapport PDF">
                                    <span class="material-symbols-outlined text-[18px]">picture_as_pdf</span>
                                </a>
                                <button onclick="deleteScan(${scan.id})" class="p-1.5 text-gray-500 hover:text-red-500 bg-gray-100 dark:bg-gray-800 rounded transition-colors" title="Supprimer">
                                    <span class="material-symbols-outlined text-[18px]">delete</span>
                                </button>
                            </div>
                        </td>
                    </tr>`;
            }
            tbody.innerHTML = html;
        }

        // --- Panneau de Résultats ---
        function closeResults() {
            document.getElementById("results-panel").classList.add("hidden");
        }

        async function viewResults(scanId) {
            const panel = document.getElementById("results-panel");
            const title = document.getElementById("resultsTitle");
            const content = document.getElementById("resultsContent");

            panel.classList.remove("hidden");
            title.textContent = `Résultats détaillés — Scan #${scanId}`;
            content.innerHTML = '<div class="flex items-center gap-2 text-gray-500"><span class="material-symbols-outlined animate-spin">sync</span> Chargement...</div>';
            panel.scrollIntoView({ behavior: "smooth", block: "start" });

            try {
                const res = await fetch(`${API_BASE}/api/scan/${scanId}/results`);
                if (!res.ok) throw new Error("Introuvable");
                const data = await res.json();

                let html = `
                    <div class="mb-6 grid grid-cols-2 gap-4 bg-gray-50 dark:bg-[#0d1c2d] p-4 rounded-lg">
                        <div><span class="text-gray-500 text-xs block mb-1 uppercase">Cible</span><strong class="text-lg">${data.scan.domaine_cible}</strong></div>
                        <div><span class="text-gray-500 text-xs block mb-1 uppercase">Statut</span><strong>${data.scan.statut}</strong></div>
                    </div>`;

                html += `<h3 class="font-bold text-brand mb-3 flex items-center gap-2"><span class="material-symbols-outlined">hub</span> Assets découverts (${data.assets.length})</h3>`;
                if (data.assets.length === 0) {
                    html += '<p class="text-gray-500 italic mb-6">Aucun asset trouvé.</p>';
                } else {
                    html += `<div class="overflow-x-auto mb-8 border border-light-border dark:border-dark-border rounded-lg"><table class="w-full text-left">
                        <thead class="bg-gray-50 dark:bg-[#0d1c2d] border-b border-light-border dark:border-dark-border">
                            <tr><th class="p-3 text-xs uppercase text-gray-500">Sous-domaine</th><th class="p-3 text-xs uppercase text-gray-500">IP</th><th class="p-3 text-xs uppercase text-gray-500">Ports</th><th class="p-3 text-xs uppercase text-gray-500">Technologies</th></tr>
                        </thead><tbody class="divide-y divide-light-border dark:divide-dark-border">`;
                    for (const a of data.assets) {
                        html += `<tr class="hover:bg-gray-50 dark:hover:bg-gray-800/30">
                            <td class="p-3 font-mono text-sm">${a.sous_domaine}</td>
                            <td class="p-3 font-mono text-sm text-gray-500">${a.adresse_ip || "N/A"}</td>
                            <td class="p-3 text-sm">${a.ports_ouverts ? `<span class="px-2 py-0.5 bg-gray-200 dark:bg-gray-700 rounded text-xs font-mono">${a.ports_ouverts}</span>` : "-"}</td>
                            <td class="p-3 text-xs">${a.technologies || "-"}</td>
                        </tr>`;
                    }
                    html += `</tbody></table></div>`;
                }

                html += `<h3 class="font-bold text-red-500 mb-3 flex items-center gap-2"><span class="material-symbols-outlined">bug_report</span> Vulnérabilités (${data.vulnerabilities.length})</h3>`;
                if (data.vulnerabilities.length === 0) {
                    html += '<p class="text-gray-500 italic">Aucune vulnérabilité critique détectée.</p>';
                } else {
                    html += `<div class="overflow-x-auto border border-light-border dark:border-dark-border rounded-lg"><table class="w-full text-left">
                        <thead class="bg-gray-50 dark:bg-[#0d1c2d] border-b border-light-border dark:border-dark-border">
                            <tr><th class="p-3 text-xs uppercase text-gray-500">Sévérité</th><th class="p-3 text-xs uppercase text-gray-500">Titre</th><th class="p-3 text-xs uppercase text-gray-500">Description</th></tr>
                        </thead><tbody class="divide-y divide-light-border dark:divide-dark-border">`;
                    for (const v of data.vulnerabilities) {
                        const sevColors = v.severite.toLowerCase() === 'critical' ? 'bg-red-600 text-white' : (v.severite.toLowerCase() === 'high' ? 'bg-orange-500 text-white' : 'bg-yellow-500 text-white');
                        html += `<tr class="hover:bg-gray-50 dark:hover:bg-gray-800/30">
                            <td class="p-3"><span class="px-2 py-1 rounded text-[10px] font-bold uppercase ${sevColors}">${v.severite}</span></td>
                            <td class="p-3 font-medium text-sm">${v.titre_cve}</td>
                            <td class="p-3 text-xs text-gray-500 dark:text-gray-400">${v.description || "-"}</td>
                        </tr>`;
                    }
                    html += `</tbody></table></div>`;
                }
                content.innerHTML = html;
            } catch (err) {
                content.innerHTML = '<p class="text-red-500 flex items-center gap-2"><span class="material-symbols-outlined">error</span> Impossible de charger les résultats.</p>';
            }
        }

        // --- Suppression ---
        async function deleteScan(scanId) {
            if (!confirm(`Supprimer définitivement le scan #${scanId} ?`)) return;
            try {
                await fetch(`${API_BASE}/api/scan/${scanId}`, { method: "DELETE" });
                showToast(`Scan #${scanId} supprimé.`, "success");
                closeResults();
                loadScans();
            } catch (err) {
                showToast("Erreur lors de la suppression.", "error");
            }
        }

        // Init
        loadScans();
    </script>
</body>
</html>
